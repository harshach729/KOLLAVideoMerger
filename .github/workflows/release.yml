name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish KOLLAVideoMerger/KOLLAVideoMerger.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath KOLLA.VideoMerger.win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: KOLLA.VideoMerger.win-x64.zip
          generate_release_notes: true
